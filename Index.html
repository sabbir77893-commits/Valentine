<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #ffe6eb;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #e6005c;
    }

    .buttons {
      position: relative;
      width: 300px;
      height: 200px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #yes {
      background-color: #ff4d79;
      color: white;
    }

    #no {
      background-color: #555;
      color: white;
      position: absolute;
      left: 120px;
      top: 80px;
    }
  </style>
</head>
<body>

  <h1>Afifa Will you be my Valentine? 💕</h1>

  <div class="buttons">
    <button id="yes" onclick="yesClicked()">Yes 💖</button>
    <button id="no" onmouseover="moveNo()">No 😜</button>
  </div>

  <script>
    function yesClicked() {
      document.body.innerHTML = "<h1>Yayyy! ❤️😍<br>Happy Valentine’s Day!</h1>";
    }

    function moveNo() {
      const noBtn = document.getElementById("no");
      const x = Math.random() * 200;
      const y = Math.random() * 150;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }
  </script>

</body>
</html>
